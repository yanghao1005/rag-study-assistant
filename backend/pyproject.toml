[project]
name = "rag-study-assistant-backend"
version = "1.0.0"
description = "RAG Study Assistant - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.0",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "supabase==2.17.0",
    "openai==1.99.9",
    "google-genai==1.20.0",
    "pypdf==5.9.0",
    "PyJWT==2.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==0.26.0",
    "ruff==0.12.5",
    "black==25.1.0",
    "mypy==1.17.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: real Supabase + OpenAI tests (RUN_REAL_INTEGRATION=1)",
]
